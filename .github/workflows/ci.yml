name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: pip install -e './backend[dev]'
      - name: Security/privacy regression gate
        run: cd backend && pytest -q -m security
      - name: Run API, accessibility, cinematic UI, and golden-path regressions
        run: cd backend && alembic upgrade head && pytest -q
      - name: Check every frontend JavaScript bundle
        run: |
          node --check frontend/app.js
          node --check frontend/vault.js
          node --check frontend/demo.js
